[package]
name = "agent_spend"
version = "0.1.0"
description = "Policy-enforced spend controls for Solana AI agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_spend"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
base64ct = "=1.6.0"
blake3 = "=1.8.2"
constant_time_eq = "=0.3.1"
indexmap = "=2.11.4"
proc-macro-crate = "=3.3.0"
toml_edit = "=0.22.27"
unicode-segmentation = "=1.12.0"
winnow = "=0.7.15"
